<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Login Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div
      class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-gray-100 text-center"
    >
      <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
      <p class="text-sm text-slate-500 mt-1 mb-6">
        Sign in with your Google account
      </p>

      <!-- Role Selection UI -->
      <div class="mb-6 text-left">
        <label
          class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2"
        >
          Select Account Type
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label
            class="flex items-center justify-center p-2.5 border rounded-lg cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50"
          >
            <input
              type="radio"
              name="userRole"
              value="CANDIDATE"
              checked
              class="w-4 h-4 text-indigo-600 focus:ring-indigo-500"
            />
            <span class="ml-2 text-sm font-medium text-slate-700"
              >Candidate</span
            >
          </label>
          <label
            class="flex items-center justify-center p-2.5 border rounded-lg cursor-pointer hover:bg-slate-50 transition-all has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50"
          >
            <input
              type="radio"
              name="userRole"
              value="COMPANY"
              class="w-4 h-4 text-indigo-600 focus:ring-indigo-500"
            />
            <span class="ml-2 text-sm font-medium text-slate-700">Company</span>
          </label>
        </div>
      </div>

      <!-- Google Sign-in Button -->
      <div
        id="g_id_onload"
        data-client_id="238495677901-7q3u1407t2n4doa1j5imcuhckfrc2jkh.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
      ></div>

      <div class="flex justify-center mb-4">
        <div
          class="g_id_signin"
          data-type="standard"
          data-size="large"
          data-theme="outline"
        ></div>
      </div>

      <!-- Status Message -->
      <div
        id="statusMessage"
        class="hidden text-sm font-medium p-3 rounded-lg mt-4"
      ></div>

      <!-- Google ID Token Display & Copy Box -->
      <div id="tokenContainer" class="hidden text-left mt-4">
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-slate-500"
            >Google ID Token:</label
          >
          <!-- 🟢 Copy Button -->
          <button
            onclick="copyToken()"
            id="copyBtn"
            class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold focus:outline-none flex items-center gap-1"
          >
            📋 Copy Token
          </button>
        </div>
        <textarea
          id="googleIdTokenInput"
          readonly
          rows="4"
          class="w-full text-xs font-mono p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none resize-none break-all text-slate-700"
        ></textarea>
      </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async></script>

    <script>
      // ১. গুগল লগইন ফাংশন
      async function handleCredentialResponse(response) {
        const statusMsg = document.getElementById("statusMessage");
        const tokenContainer = document.getElementById("tokenContainer");
        const googleIdTokenInput =
          document.getElementById("googleIdTokenInput");

        statusMsg.className =
          "text-sm font-medium p-3 rounded-lg mt-4 bg-blue-50 text-blue-600 block";
        statusMsg.innerText = "Authenticating with backend...";
        tokenContainer.classList.add("hidden");

        const selectedRole = document.querySelector(
          'input[name="userRole"]:checked',
        ).value;

        // Google Credential (ID Token) পাওয়ার সাথে সাথে তা LocalStorage-এ সংরক্ষণ করা
        const googleIdToken = response.credential;
        localStorage.setItem("googleIdToken", googleIdToken);

        try {
          const res = await fetch(
            "http://localhost:5000/api/v1/auth/google-login",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                idToken: googleIdToken,
                role: selectedRole,
              }),
            },
          );

          const result = await res.json();

          if (res.ok && result.success) {
            // UI-তে Google ID Token প্রদর্শন করা
            googleIdTokenInput.value = googleIdToken;
            tokenContainer.classList.remove("hidden");

            statusMsg.className =
              "text-sm font-medium p-3 rounded-lg mt-4 bg-emerald-50 text-emerald-600 block";
            statusMsg.innerText = `Google Authentication Successful as ${selectedRole}!`;
          } else {
            throw new Error(result.message || "Login failed");
          }
        } catch (error) {
          statusMsg.className =
            "text-sm font-medium p-3 rounded-lg mt-4 bg-red-50 text-red-600 block";
          statusMsg.innerText = "Error: " + error.message;
        }
      }

      // 🟢 ২. Token Copy করার ফাংশন
      function copyToken() {
        const tokenInput = document.getElementById("googleIdTokenInput");
        const copyBtn = document.getElementById("copyBtn");

        if (!tokenInput.value) return;

        navigator.clipboard.writeText(tokenInput.value).then(() => {
          copyBtn.innerText = "✅ Copied!";
          copyBtn.classList.replace("text-indigo-600", "text-emerald-600");

          setTimeout(() => {
            copyBtn.innerText = "📋 Copy Token";
            copyBtn.classList.replace("text-emerald-600", "text-indigo-600");
          }, 2000);
        });
      }
    </script>
  </body>
</html>
